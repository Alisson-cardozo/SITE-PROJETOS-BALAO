server {
    listen 80;
    server_name _;
    client_max_body_size 30M;

    root /usr/share/nginx/html;
    index index.html;

    # health simples
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # API PHP (sistema-novo)
    location /api {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Uploads do backend
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        access_log off;
        expires 7d;
        try_files $uri =404;
    }

    # SPA (React) + assets estáticos (lek.html, data.json, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache de assets com hash
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
